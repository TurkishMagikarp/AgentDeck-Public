services:
  agentdeck:
    build: .
    restart: unless-stopped
    # Only reachable from the host; use the application token to sign in, or put a reverse proxy
    # with its own login in front (AGENTDECK_TRUST_PROXY=1 plus AGENTDECK_PROXY_SECRET, see README).
    ports:
      - "127.0.0.1:8790:8790"
    environment:
      AGENTDECK_TOKEN: ${AGENTDECK_TOKEN:?set AGENTDECK_TOKEN in .env}
      AGENTDECK_TRUST_PROXY: ${AGENTDECK_TRUST_PROXY:-0}
      AGENTDECK_PROXY_SECRET: ${AGENTDECK_PROXY_SECRET:-}
      AGENTDECK_CACHE_MB: "1024"
    volumes:
      - data:/data
      - home:/home/node          # CLI logins (claude, codex, opencode) survive restarts
      - /srv/agentdeck/repos:/repos
    init: true
    # Lets the sandbox helper set the firewall rules of projects with an egress allowlist.
    # Without it such projects stay open (the settings page says so).
    cap_add:
      - NET_ADMIN

volumes:
  data:
  home:
